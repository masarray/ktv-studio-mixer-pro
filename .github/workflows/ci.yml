name: Pull Request CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ktv-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build and regression contracts
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Validate Electron metadata
        run: npm run test:electron-metadata

      - name: Validate Windows packaging contract
        run: npm run test:windows-packaging

      - name: Validate system layout contract
        run: npm run test:system-layout

      - name: Validate UX control contract
        run: npm run test:ux-controls

      - name: Validate hardening regressions
        run: npm run test:v0842-hardening

      - name: Validate performance regressions
        run: npm run test:v0843-performance

      - name: Validate preset catalog
        run: npm run test:preset-catalog

      - name: Validate builtin presets
        run: npm run test:builtin-presets

      - name: Production web build
        run: npm run build
