name: Pull Request CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ktv-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build and regression contracts
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Keep the repository-wide lint debt visible, but do not let pre-existing
      # findings prevent the regression/build gates below from executing.
      - name: Full repository lint (baseline visibility)
        id: full_lint
        continue-on-error: true
        run: npm run lint

      # New or modified JS/TS source must be clean even while legacy lint debt
      # is being paid down. This is the blocking no-new-debt gate for PRs.
      - name: Enforce no new lint debt
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          $base = "${{ github.event.pull_request.base.sha }}"
          if ([string]::IsNullOrWhiteSpace($base)) {
            throw "Pull-request base SHA is unavailable; cannot enforce changed-file lint."
          }

          $changed = @(
            git diff --name-only "$base...HEAD" |
              Where-Object { $_ -match '\.(js|jsx|ts|tsx|mjs|cjs)$' }
          )

          if ($changed.Count -eq 0) {
            Write-Host "No JavaScript/TypeScript source files changed; no-new-debt lint passes."
            exit 0
          }

          Write-Host "Blocking lint for changed source files:"
          $changed | ForEach-Object { Write-Host " - $_" }
          & npx eslint -- @changed
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Record baseline lint status
        if: always()
        shell: pwsh
        run: |
          if ("${{ steps.full_lint.outcome }}" -eq "failure") {
            Add-Content $env:GITHUB_STEP_SUMMARY "### Lint baseline"
            Add-Content $env:GITHUB_STEP_SUMMARY "⚠️ Full-repository ESLint still reports pre-existing debt. Changed JS/TS files remain protected by the blocking no-new-debt gate."
          } else {
            Add-Content $env:GITHUB_STEP_SUMMARY "### Lint baseline"
            Add-Content $env:GITHUB_STEP_SUMMARY "✅ Full-repository ESLint is clean."
          }

      - name: Validate Electron metadata
        run: npm run test:electron-metadata

      - name: Validate Windows packaging contract
        run: npm run test:windows-packaging

      - name: Validate system layout contract
        run: npm run test:system-layout

      - name: Validate UX control contract
        run: npm run test:ux-controls

      - name: Validate hardening regressions
        run: npm run test:v0842-hardening

      - name: Validate performance regressions
        run: npm run test:v0843-performance

      - name: Validate preset catalog
        run: npm run test:preset-catalog

      - name: Validate builtin presets
        run: npm run test:builtin-presets

      - name: Production web build
        run: npm run build
